# Vérification automatique à chaque envoi sur GitHub : types, tests, construction et tests de bout en bout.
name: Tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: cave_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cave_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cave_test
      SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: rapport-playwright, path: test-results, retention-days: 7 }
